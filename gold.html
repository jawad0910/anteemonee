<!DOCTYPE html><html><head><title>gold</title></head><body>
<script>
fetch('/ai-examiner/index.html').then(function(r){ return r.text(); }).then(function(html){
  var inject = '<script>try{currentUser={id:"demo-user-x"};}catch(e){}\u003C/script>';
  html = html.replace('</body>', inject + '</body>');
  var f = document.createElement('iframe');
  f.id='f'; f.style.cssText='width:1200px;height:1300px;border:0';
  document.body.appendChild(f);
  var d=f.contentDocument; d.open(); d.write(html); d.close();
});
</script>
<script>
var resEl=document.createElement('pre'); resEl.id='res'; document.body.appendChild(resEl);
var P='AE2'; var mkr=P+'_RES: ';
setTimeout(function(){
  var d=document.getElementById('f').contentDocument;
  try{
    var o=[];
    o.push('attachBtn='+!!d.getElementById('ae-attach-btn'));
    o.push('confirmDisabled='+d.getElementById('ae-confirm').disabled);
    o.push('tabs='+d.querySelectorAll('.ae-tab').length);
    o.push('rowsInit='+d.querySelectorAll('#ae-rows .ae-typed-row').length);
    // add rows + type
    for(var i=0;i<2;i++){ d.getElementById('ae-add-row').click(); }
    var rows=d.querySelectorAll('#ae-rows .ae-typed-row');
    rows[0].querySelectorAll('textarea')[0].value='Q1';
    rows[0].querySelectorAll('textarea')[1].value='A1';
    rows[0].querySelector('textarea').dispatchEvent(new d.defaultView.Event('input',{bubbles:true}));
    o.push('sum='+d.getElementById('ae-sum-num').textContent);
    o.push('checkEnabled='+(!d.getElementById('ae-check').disabled));
    o.push('convertLink='+!!d.querySelector('.ae-convert-line a'));
    resEl.textContent = mkr + o.join(' | ');
  }catch(e){ resEl.textContent = mkr+'ERR '+e.message; }
}, 9000);
</script></body></html>
