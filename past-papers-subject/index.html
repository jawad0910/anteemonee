  <style>
    :root{
      --fc-font: var(--font-ui);
      --fc-ease:cubic-bezier(.32,.72,0,1);

    }

    body{overflow-x:hidden;overflow-y:auto;background:var(--bg)!important}

    .fc-empty{text-align:center;padding:60px 20px;color:var(--text-secondary)}
    .fc-empty h3{font-size:17px;color:var(--text);margin-bottom:8px}

    .fc-toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--liquid-bg-strong);-webkit-backdrop-filter:var(--liquid-blur);backdrop-filter:var(--liquid-blur);border:1px solid var(--liquid-border);color:var(--text);padding:13px 22px;border-radius:999px;font-size:14px;font-weight:600;z-index:3000;opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;box-shadow:var(--liquid-inset),var(--liquid-shadow);max-width:calc(100vw - 32px);text-align:center}
    .fc-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    .sub-header{display:flex;align-items:center;gap:13px;margin-bottom:20px}
    .sub-header .study-back{
      width:38px;height:38px;border-radius:50%;padding:0;font-size:16px;
      display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
      background:var(--liquid-bg-soft);border:1px solid var(--liquid-border-soft);
      color:var(--text-secondary);cursor:pointer;
      transition:transform .25s var(--fc-ease),background-color .25s,color .25s,border-color .25s;
    }
    .sub-header .study-back:hover{background:var(--liquid-bg);color:var(--text);transform:translateX(-2px);border-color:var(--liquid-border)}
    .sub-header .study-back:active{transform:translateX(-2px) scale(.94)}
    .sub-icon{
      width:46px;height:46px;border-radius:14px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-family:var(--fc-font);font-weight:700;font-size:17px;letter-spacing:-.02em;
      background:var(--accent-soft);
    }
    .sub-info{flex:1;min-width:0}
    .sub-info h2{
      font-family:var(--fc-font);font-size:1.4rem;font-weight:700;letter-spacing:-.022em;
      margin:0 0 3px;color:var(--text);
    }
    .sub-info .sub-code{
      font-family:var(--fc-font);font-size:12.5px;font-weight:600;letter-spacing:-.01em;
      color:var(--text-muted);opacity:1;
    }

    /* ========== BOARD LIST ========== */
    .list-header{font-family:var(--fc-font);font-size:1.05rem;font-weight:650;letter-spacing:-.015em;margin:0 0 14px;color:var(--text-secondary)}
    .board-list{display:flex;flex-direction:column;gap:12px}

    .board-row{
      background:var(--liquid-bg-soft);border:1px solid var(--liquid-border-soft);
      border-radius:18px;overflow:hidden;
      transition:transform .3s var(--fc-ease),border-color .3s var(--fc-ease),box-shadow .3s var(--fc-ease),background-color .3s var(--fc-ease);
      will-change:transform;
    }
    .board-row:hover{transform:translateY(-2px);border-color:var(--liquid-border);box-shadow:0 10px 34px rgba(0,0,0,.24)}

    .board-header{
      display:flex;align-items:center;gap:13px;width:100%;
      padding:15px 16px;margin:0;border:none;background:none;color:inherit;
      font-family:var(--fc-font);text-align:left;cursor:pointer;
      transition:background-color .25s var(--fc-ease);
    }
    .board-header:hover{background:var(--liquid-bg-soft)}
    .board-header:active{background:var(--liquid-bg)}
    .board-header:focus-visible{outline:2px solid var(--text);outline-offset:-3px}

    .board-num{
      width:38px;height:38px;border-radius:12px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:700;letter-spacing:.02em;
      background:var(--accent-soft);color:var(--text);
    }
    .board-title{
      flex:1;min-width:0;font-size:15.5px;font-weight:650;letter-spacing:-.018em;color:var(--text);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .board-badge{
      display:inline-flex;align-items:center;gap:4px;flex-shrink:0;
      padding:4px 10px;border-radius:999px;
      background:var(--accent-soft);border:none;color:var(--text-secondary);
      font-size:11.5px;font-weight:650;letter-spacing:-.005em;
      font-variant-numeric:tabular-nums;white-space:nowrap;
    }
    .board-open{
      display:inline-flex;align-items:center;gap:7px;flex-shrink:0;
      padding:8px 15px;border-radius:999px;border:none;
      background:var(--accent);color:var(--on-accent);
      font-family:var(--fc-font);font-size:13px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;
      box-shadow:0 1px 2px rgba(0,0,0,.28);
      transition:transform .22s var(--fc-ease),box-shadow .22s var(--fc-ease),background-color .22s var(--fc-ease),opacity .22s;
    }
    .board-open svg{width:11px;height:11px;fill:currentColor}
    .board-header:hover .board-open{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.3)}
    .board-header:active .board-open{transform:translateY(0) scale(.97);box-shadow:0 1px 2px rgba(0,0,0,.28)}
    .board-header:focus-visible .board-open{outline:2px solid var(--text);outline-offset:2px}

    /* Board preview chips under a row */
    .board-years{display:flex;gap:6px;flex-wrap:wrap;padding:2px 16px 14px}
    .board-year-chip{
      padding:4px 10px;border-radius:999px;
      background:var(--liquid-bg-soft);border:1px solid var(--liquid-border-soft);
      font-family:var(--fc-font);font-size:11.5px;font-weight:650;color:var(--text-secondary);
      font-variant-numeric:tabular-nums;
    }
    @media(max-width:560px){
      .board-title{font-size:14.5px}
      .board-open{padding:7px 12px;font-size:12.5px}
    }

    @media(max-width:640px){
      .fc-page{padding:100px 16px 70px}
    }

  <script>
    (function () {
      'use strict';

      var SUBJECTS={
        'Physics':{code:'9702',letter:'P'},
        'Chemistry':{code:'9701',letter:'C'},
        'Biology':{code:'9700',letter:'B'},
        'Mathematics':{code:'9709',letter:'M'},
        'English':{code:'9093',letter:'E'},
        'Computer Science':{code:'9618',letter:'CS'}
      };

      var subjectName='';
      var boards={};

      function $(id){return document.getElementById(id)}
      function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
      function uid(){try{if(typeof currentUser!=='undefined'&&currentUser&&currentUser.id)return currentUser.id}catch(_){}return null}
      function toast(msg){var el=$('pp-toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show')},2600)}

      function usable(p){
        var u=String(p.file_path||p.source_url||'').trim();
        if(!u) return false;
        if(!/^https?:\/\//i.test(u)) return /past-papers-pdf/i.test(u);
        return u.indexOf('past-papers-pdf')!==-1||u.indexOf('res.cloudinary.com')!==-1||u.indexOf('/raw/upload/')!==-1;
      }
      function isPunjab(region){
        return String(region||'').toLowerCase().indexOf('punjab')!==-1;
      }
      function boardInitials(name){
        // "BISE Lahore" → "LA" · "FBISE — Federal Board" → "FE"
        var m=String(name||'').match(/BISE\s+([A-Za-z]+)/i);
        var word=m?m[1]:String(name||'').replace(/FBISE|BIEK/gi,function(w){return w+' '}).split(' ')[0];
        word=String(word||'').replace(/[^A-Za-z]/g,'');
        if(!word) return '';
        return word.slice(0,2).toUpperCase();
      }

      /* ========== LOAD ========== */

      async function loadBoards(){
        var info=SUBJECTS[subjectName];
        // 1) subject ids that carry this name
        var sRes=await withTimeout(db.from('subjects').select('id,name'),15000,'load subjects');
        var subjectIds=(sRes.data||[]).filter(function(s){return s.name===subjectName}).map(function(s){return s.id});
        if(!sRes.error&&!subjectIds.length){showEmpty();return}
        var paperQuery=db.from('past_papers')
          .select('board_id,file_path,source_url,subject_id,year')
          .eq('status','published');
        if(subjectIds.length) paperQuery=paperQuery.in('subject_id',subjectIds);
        else paperQuery=paperQuery.limit(0);
        var res=await withTimeout(paperQuery,15000,'load papers');
        if(res.error) throw res.error;
        var papers=(res.data||[]).filter(usable);

        // 2) boards (to keep Punjab only)
        var bRes=await withTimeout(db.from('boards').select('id,name,region').order('name'),10000,'load boards');
        var boardRows=(bRes.data||[]).filter(function(b){return isPunjab(b.region)});

        boards={};
        papers.forEach(function(p){
          var key=String(p.board_id);
          if(!boards[key]) boards[key]={id:p.board_id,name:'',count:0,years:{}};
          boards[key].count++;
          if(p.year) boards[key].years[String(p.year)]=true;
        });
        boardRows.forEach(function(b){
          var key=String(b.id);
          if(boards[key]) boards[key].name=b.name;
        });
        Object.keys(boards).forEach(function(k){ if(!boards[k].name) delete boards[k]; });

        $('pp-loading').style.display='none';
        var list=Object.values(boards);
        if(!list.length){showEmpty();return}

        renderSubjectHeader(list);
        list.sort(function(a,b){return b.count-a.count});
        renderBoards(list,info);
      }

      function showEmpty(){
        $('pp-loading').style.display='none';
        $('sub-header').style.display='none';
        $('board-list-view').style.display='none';
        $('pp-empty').style.display='block';
      }

      /* ========== HEADER ========== */

      function renderSubjectHeader(list){
        var info=SUBJECTS[subjectName]||{letter:subjectName.charAt(0)};
        var total=0; list.forEach(function(b){total+=b.count});
        $('sub-header').style.display='flex';
        $('sub-icon').textContent=info.letter;
        $('sub-title').textContent=subjectName;
        $('sub-code').textContent=list.length+' board'+(list.length===1?'':'s')+' · '+total+' paper'+(total===1?'':'s');
      }

      /* ========== BOARD LIST ========== */

      var ARROW='<svg viewBox="0 0 24 24" aria-hidden="true" style="width:11px;height:11px;fill:currentColor"><path d="M5 3.5v17l14-8.5z"/></svg>';

      function renderBoards(list,info){
        var wrap=$('board-list');
        $('board-list-view').style.display='block';
        $('list-header').textContent='Choose a board to open its '+esc(subjectName)+' papers.';
        var html=list.map(function(b){
          var years=Object.keys(b.years).sort(function(a,b){return b-a}).slice(0,4);
          var yearChips='';
          if(years.length) yearChips='<div class="board-years">'+years.map(function(y){return '<span class="board-year-chip">'+esc(y)+'</span>'}).join('')+'</div>';
          return '<article class="board-row">'
            +'<button type="button" class="board-header" data-board="'+esc(b.id)+'" data-name="'+esc(b.name)+'">'
            +'<span class="board-num">'+esc(boardInitials(b.name)||'BI')+'</span>'
            +'<span class="board-title">'+esc(b.name)+'</span>'
            +'<span class="board-badge">'+b.count+' paper'+(b.count===1?'':'s')+'</span>'
            +'<span class="board-open">'+ARROW+'Browse</span>'
            +'</button>'
            +yearChips
            +'</article>';
        }).join('');
        wrap.innerHTML=html;
      }

      /* Row click → papers page */
      document.addEventListener('click',function(e){
        var head=e.target&&e.target.closest?e.target.closest('.board-header'):null;
        if(!head) return;
        var id=head.getAttribute('data-board');
        var name=head.getAttribute('data-name');
        if(!id) return;
        if(window.top!==window.self){ try{ window.top.location.href='../past-papers-board/?subject='+encodeURIComponent(subjectName)+'&board='+encodeURIComponent(id); return; }catch(_){} }
        window.location.href='../past-papers-board/?subject='+encodeURIComponent(subjectName)+'&board='+encodeURIComponent(id)+'&boardname='+encodeURIComponent(name||'');
      });

      $('back-btn').addEventListener('click',function(){ window.location.href='../past-papers/'; });

      /* ========== INIT ========== */

      async function init(){
        subjectName=new URLSearchParams(window.location.search).get('subject')||'';
        if(!subjectName){window.location.href='../past-papers/';return}

        try{await checkAuth()}catch(_){}
        if(!uid()){$('pp-not-auth').style.display='block';return}
        try{if(typeof Access!=='undefined')await Access.init()}catch(_){}
        $('pp-page').style.display='block';
        document.title=subjectName+' Past Papers — Anteemonee';

        window.addEventListener('scroll',function(){
          var h=$('header');if(h) h.classList.toggle('scrolled',window.scrollY>20);
        },{passive:true});

        loadBoards().catch(function(err){
          console.warn('[PastPapers] load failed:',err);
          showEmpty();
          $('pp-empty-text').textContent='Could not load papers. Please refresh the page.';
          toast('Could not load papers');
        });
      }

      if(document.readyState==='loading'){
        document.addEventListener('DOMContentLoaded',function(){init()});
      }else{init()}
    })();
  </script>

  <script>
    (function () {
      function renderLandingAuth() {
        try {
          var user = (typeof currentUser !== 'undefined' && currentUser) ? currentUser : null;
          var loggedOut = document.getElementById('landing-auth');
          var loggedIn = document.getElementById('landing-auth-in');
          if (!loggedOut || !loggedIn) return;
          if (user) {
            loggedOut.style.display = 'none';
            var fullName = (user.user_metadata && (user.user_metadata.full_name || user.user_metadata.name)) || '';
            var username = fullName ? fullName.trim().split(/\s+/)[0] : (user.email || 'User').split('@')[0];
            var initial = (fullName || username || 'U').charAt(0).toUpperCase();
            var imgUrl = (typeof currentProfile !== 'undefined' && currentProfile ? currentProfile.profile_image_url : undefined) ?? (user.user_metadata && (user.user_metadata.avatar_url ?? user.user_metadata.picture)) ?? (user.user_metadata && user.user_metadata.profile_image_url) ?? '';
            var dropdownHtml =
              '<div class="landing-profile-dropdown" id="landing-profile-dropdown">' +
                '<button class="avatar-btn" onclick="toggleLandingProfileDropdown()" aria-label="Profile menu">' +
                  '<div class="avatar-wrapper">' +
                    (imgUrl ? '<img src="' + imgUrl + '" alt="' + username + '" class="avatar-img" referrerpolicy="no-referrer" style="filter:none;-webkit-filter:none;mix-blend-mode:normal;opacity:1" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"/><div class="avatar-fallback" style="display:none">' + initial + '</div>' : '<div class="avatar-fallback">' + initial + '</div>') +
                  '</div>' +
                '</button>' +
                '<div class="profile-dropdown" id="landing-profile-dropdown-menu">' +
                  '<div class="dropdown-header">' +
                    '<div class="dropdown-avatar">' +
                      (imgUrl ? '<img src="' + imgUrl + '" alt="' + username + '" class="dropdown-avatar-img" referrerpolicy="no-referrer" style="filter:none;-webkit-filter:none;mix-blend-mode:normal;opacity:1" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"/><div class="avatar-fallback dropdown-avatar-fallback" style="display:none">' + initial + '</div>' : '<div class="avatar-fallback dropdown-avatar-fallback">' + initial + '</div>') +
                    '</div>' +
                    '<div class="dropdown-info">' +
                      '<span class="dropdown-name">' + (fullName || username) + '</span>' +
                      '<span class="dropdown-email">' + (user.email || '') + '</span>' +
                    '</div>' +
                  '</div>' +
                  '<div class="dropdown-divider"></div>' +
                  '<a href="../account/" class="dropdown-item">' +
                    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' +
                    'Account' +
                  '</a>' +
                  '<a href="../settings/" class="dropdown-item" onclick="closeLandingProfileDropdown()">' +
                    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l-.06-.06a2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>' +
                    'Settings' +
                  '</a>' +
                  '<div class="dropdown-divider"></div>' +
                  '<button class="dropdown-item dropdown-logout" onclick="handleLandingLogout()">' +
                    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>' +
                    'Logout' +
                  '</button>' +
                '</div>' +
              '</div>';
            loggedIn.innerHTML = dropdownHtml;
            loggedIn.style.display = 'flex';
            setupLandingProfileDropdown();
          } else {
            loggedIn.style.display = 'none';
            loggedOut.style.display = 'flex';
          }
        } catch (_) {}
      }
      function setupLandingProfileDropdown() {
        var dropdown = document.getElementById('landing-profile-dropdown-menu');
        var container = document.getElementById('landing-profile-dropdown');
        if (!dropdown || !container) return;
        var hideTimer = null;
        function scheduleHide() { hideTimer = setTimeout(function() { dropdown.classList.remove('open'); }, 150); }
        function cancelHide() { if (hideTimer) clearTimeout(hideTimer); }
        container.addEventListener('mouseenter', cancelHide);
        container.addEventListener('mouseleave', scheduleHide);
        dropdown.addEventListener('mouseenter', cancelHide);
        dropdown.addEventListener('mouseleave', scheduleHide);
      }
      if (!window._landingDropdownClickHandler) {
        document.addEventListener('click', function(e) {
          var container = document.getElementById('landing-profile-dropdown');
          var dropdown = document.getElementById('landing-profile-dropdown-menu');
          if (container && dropdown && !container.contains(e.target)) dropdown.classList.remove('open');
        });
        window._landingDropdownClickHandler = true;
      }
      function toggleLandingProfileDropdown() {
        var dropdown = document.getElementById('landing-profile-dropdown-menu');
        if (dropdown) dropdown.classList.toggle('open');
      }
      function closeLandingProfileDropdown() {
        var dropdown = document.getElementById('landing-profile-dropdown-menu');
        if (dropdown) dropdown.classList.remove('open');
      }
      function handleLandingLogout() {
        try {
          if (typeof handleLogout === 'function') handleLogout();
          else window.location.href = '../index.html';
        } catch (_) { window.location.href = '../index.html'; }
      }
      window.toggleLandingProfileDropdown = toggleLandingProfileDropdown;
      window.closeLandingProfileDropdown = closeLandingProfileDropdown;
      window.handleLandingLogout = handleLandingLogout;
      renderLandingAuth();
      var tries = 0;
      var timer = setInterval(function () {
        tries++;
        renderLandingAuth();
        if (tries > 40) clearInterval(timer);
        if (window.__authReady === true) clearInterval(timer);
      }, 300);
      var hdr = document.getElementById('site-header');
      window.addEventListener('scroll', function () { if (hdr) hdr.classList.toggle('scrolled', window.scrollY > 10); }, { passive: true });
    })();
  </script>
  <script src="../js/site-chrome.js?v=9"></script>
