<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var m = null;
        try { m = localStorage.getItem('Anteemonee_theme_mode') || localStorage.getItem('Anteemonee_theme'); } catch (_) {}
        var t = (m === 'light' || m === 'dark') ? m : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', t);
      } catch (_) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Anteemonee</title>
  <meta name="description" content="Create your free Anteemonee account.">
  <meta name="theme-color" content="#07080C">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/anteemonee.png">
  <link rel="preconnect" href="https://zkuytvjeqkpexcbyoyhz.supabase.co">
  <link rel="stylesheet" href="../css/style.css?v=35">
  <link rel="stylesheet" href="../css/header.css?v=2">
  <style>body{overflow-x:hidden;overflow-y:auto;background:var(--bg)}</style>
</head>
<body>
  <header class="header header-auth">
    <div class="header-inner">
      <a href="../index.html" class="logo-link">
        <img src="../assets/anteemonee.png" alt="Anteemonee" class="logo-img">
        <span class="logo-text">Anteemonee</span>
      </a>
    </div>
  </header>

  <div class="auth-page">
    <div class="hero-glow hero-glow-1"></div>
    <div class="hero-glow hero-glow-2"></div>
    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="logo-link">
          <img src="../assets/anteemonee.png" alt="Anteemonee" class="logo-img">
          <span class="logo-text">Anteemonee</span>
        </a>
        <h1>Create your account</h1>
        <p>Taking you to sign up…</p>
      </div>
    </div>
  </div>

  <script src="/assets/js/vendor/supabase.min.js"></script>
  <script src="../js/account-manager.js?v=11"></script>
  <script src="../js/app.js?v=32"></script>
  <script src="../js/login-modal.js?v=5"></script>
  <script src="../js/forgot-modal.js?v=2"></script>
  <script src="../js/signup-modal.js?v=3"></script>
  <script src="../js/header-ai-dropdown.js?v=7"></script>
  <script>
    // Sign-up lives in the modal. This page exists so deep links land somewhere
    // real instead of a 404: go to the homepage which opens the signup popup.
    (function () {
      var url = '../index.html?auth=signup';
      window.location.replace(url);
    })();
  </script>
</body>
</html>
