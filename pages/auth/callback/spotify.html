<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecting with Spotify — Wassal</title>
  <meta name="theme-color" content="#07080C">
  <link rel="icon" href="../../../assets/wassal.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="preconnect" href="https://zkuytvjeqkpexcbyoyhz.supabase.co">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="preload" href="https://unpkg.com/@supabase/supabase-js@2" as="script">
  <style>
    .callback-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    .callback-card {
      width: 100%;
      max-width: 400px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      padding: 48px 36px;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .callback-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    }
    .callback-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 16px;
      animation: callback-pulse 2s ease-in-out infinite;
    }
    @keyframes callback-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.95); }
    }
    .callback-provider-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(29, 185, 84, 0.08);
      border: 1px solid rgba(29, 185, 84, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .callback-provider-icon svg {
      width: 24px;
      height: 24px;
    }
    .callback-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 8px;
    }
    .callback-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }
    .callback-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .callback-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .callback-status {
      font-size: 14px;
      color: var(--text-secondary);
      min-height: 20px;
    }
    .callback-success {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .success-check {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(53, 211, 154, 0.1);
      border: 1.5px solid rgba(53, 211, 154, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      animation: scaleIn 0.3s ease;
    }
    @keyframes scaleIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .success-message {
      font-size: 15px;
      color: var(--success);
      font-weight: 500;
    }
    .callback-error {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .error-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255, 102, 117, 0.1);
      border: 1.5px solid rgba(255, 102, 117, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .error-message {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .error-actions {
      display: flex;
      gap: 12px;
      width: 100%;
    }
    .error-actions a,
    .error-actions button {
      flex: 1;
    }
  </style>
</head>
<body>

  <div class="callback-page">
    <div class="hero-glow hero-glow-1"></div>
    <div class="hero-glow hero-glow-2"></div>

    <div class="callback-card">
      <img src="../../../assets/wassal.png" alt="Wassal" class="callback-logo">

      <div class="callback-provider-icon">
        <svg viewBox="0 0 24 24"><path fill="#1DB954" d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
      </div>

      <h1 class="callback-title">Connecting with Spotify</h1>
      <p class="callback-subtitle">Setting up your Wassal account...</p>

      <div class="callback-loading" id="callback-loading">
        <div class="callback-spinner"></div>
        <span class="callback-status" id="callback-status">Signing you in...</span>
      </div>

      <div class="callback-success" id="callback-success">
        <div class="success-check">&#10003;</div>
        <span class="success-message">Connected successfully!</span>
      </div>

      <div class="callback-error" id="callback-error">
        <div class="error-icon">&#10007;</div>
        <span class="error-message">Something went wrong.</span>
        <div class="error-actions">
          <a href="../login.html" class="btn-secondary" style="min-height:48px;font-size:14px">Back to Login</a>
          <button class="btn-primary" style="min-height:48px;font-size:14px" onclick="window.location.reload()">Try Again</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="callback.js"></script>
</body>
</html>
