<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecting GitHub - Anteemonee</title>
  <meta name="theme-color" content="#07080C">
  <link rel="icon" href="../../../assets/anteemonee.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="preconnect" href="https://zkuytvjeqkpexcbyoyhz.supabase.co">
  <link rel="stylesheet" href="../../../css/style.css">
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0" as="script">
  <script>
    // Apply saved theme mode (light/dark/device) before first paint.
    (function () {
      try {
        var m = null;
        try { m = localStorage.getItem('Anteemonee_theme_mode') || localStorage.getItem('Anteemonee_theme'); } catch (_) {}
        var t = (m === 'light' || m === 'dark') ? m : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', t);
      } catch (_) {}
    })();
  </script>
  <style>
    .callback-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    .callback-card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      box-shadow: var(--neo-shadow-raised-lg);
      padding: 48px 36px;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .callback-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 16px;
      animation: callback-pulse 2s ease-in-out infinite;
    }
    @keyframes callback-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.95); }
    }
    .callback-provider-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: var(--neo-shadow-recessed-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: var(--text-primary);
    }
    .callback-provider-icon svg {
      width: 24px;
      height: 24px;
    }
    .callback-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 8px;
    }
    .callback-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }
    .callback-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .callback-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--surface);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .callback-status {
      font-size: 14px;
      color: var(--text-secondary);
      min-height: 20px;
    }
    .callback-success {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .success-check {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(53, 211, 154, 0.1);
      border: 1.5px solid rgba(53, 211, 154, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      animation: scaleIn 0.3s ease;
      box-shadow: var(--neo-shadow-raised-sm);
    }
    @keyframes scaleIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .success-message {
      font-size: 15px;
      color: var(--success);
      font-weight: 500;
    }
    .callback-error {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .error-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255, 102, 117, 0.1);
      border: 1.5px solid rgba(255, 102, 117, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: var(--neo-shadow-raised-sm);
    }
    .error-message {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .error-actions {
      display: flex;
      gap: 12px;
      width: 100%;
    }
    .error-actions a {
      flex: 1;
    }
  </style>
</head>
<body>

  <div class="callback-page">
    <div class="hero-glow hero-glow-1"></div>
    <div class="hero-glow hero-glow-2"></div>

    <div class="callback-card">
      <img src="../../../assets/anteemonee.png" alt="Anteemonee" class="callback-logo">

      <div class="callback-provider-icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      </div>

      <h1 class="callback-title">Connecting GitHub</h1>
      <p class="callback-subtitle">Linking your repositories to Coder...</p>

      <div class="callback-loading" id="callback-loading">
        <div class="callback-spinner"></div>
        <span class="callback-status" id="callback-status">Finishing up...</span>
      </div>

      <div class="callback-success" id="callback-success">
        <div class="success-check">&#10003;</div>
        <span class="success-message" id="callback-success-msg">GitHub connected!</span>
      </div>

      <div class="callback-error" id="callback-error">
        <div class="error-icon">&#10007;</div>
        <span class="error-message">Something went wrong.</span>
        <div class="error-actions">
          <a href="../../index.html" class="btn-secondary" style="min-height:48px;font-size:14px">Back to Chat</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script>
  <script src="../../../js/github.js?v=7"></script>
  <script>
    (function () {
      var SUPABASE_URL = 'https://zkuytvjeqkpexcbyoyhz.supabase.co';
      var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InprdXl0dmplcWtwZXhjYnlveWh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjUwNDAsImV4cCI6MjEwMzAwMTA0MH0.8tMbR057BmGaO0_T4nMOVLt1AAmWsPKBEopoSYYis44';

      function showSuccess(username) {
        document.getElementById('callback-loading').style.display = 'none';
        var ok = document.getElementById('callback-success');
        ok.style.display = 'flex';
        if (username) {
          document.getElementById('callback-success-msg').textContent = 'Connected as @' + username + '!';
        }
        setTimeout(function () {
          window.location.href = window.location.origin + '/';
        }, 1500);
      }

      function showError(message) {
        document.getElementById('callback-loading').style.display = 'none';
        var err = document.getElementById('callback-error');
        err.style.display = 'flex';
        err.querySelector('.error-message').textContent = message;
      }

      try {
        var client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        GitHub.handleCallback(client).then(showSuccess).catch(function (err) {
          showError(err.message || 'Could not connect GitHub.');
        });
      } catch (err) {
        showError(err.message || 'Could not connect GitHub.');
      }
    })();
  </script>
</body>
</html>
