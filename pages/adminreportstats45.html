<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Provider Usage — Anteemonee Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/anteemonee.png">
<style>
  :root {
    --bg: #0B0C0F;
    --card: #14161B;
    --card-2: #1A1D24;
    --border: #262A33;
    --text: #F2F4F8;
    --muted: #8A93A3;
    --accent: #6366F1;
    --ok: #34D399;
    --warn: #F59E0B;
    --err: #F87171;
    --groq1: #6366F1;
    --groq2: #22D3EE;
    --mistral: #F97316;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 28px 20px 60px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .refresh {
    padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card-2); color: var(--text); font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all .15s ease;
  }
  .refresh:hover { border-color: #3A3F4B; }
  .refresh:disabled { opacity: .5; cursor: wait; }

  .banner {
    display: none; padding: 12px 15px; border-radius: 12px; font-size: 13px;
    line-height: 1.55; margin-bottom: 18px; border: 1px solid;
  }
  .banner.show { display: block; }
  .banner.err { background: rgba(248,113,113,.08); border-color: rgba(248,113,113,.35); color: #FCA5A5; }
  .banner.warn { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.32); color: #FCD34D; }
  .banner code { background: rgba(255,255,255,.07); padding: 1px 6px; border-radius: 5px; font-size: 12px; }

  .grid { display: grid; gap: 14px; }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 900px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .grid-4 { grid-template-columns: 1fr; } }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; }
  .card h2 { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }

  .metric { margin-bottom: 14px; }
  .metric:last-child { margin-bottom: 0; }
  .metric-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 5px; }
  .metric-label { font-size: 13px; font-weight: 600; }
  .metric-val { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .metric-sub { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .keyhead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .pill { font-size: 10px; font-weight: 700; letter-spacing: .05em; padding: 2px 7px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--border); color: var(--muted); }
  .pill.on { color: var(--ok); border-color: rgba(52,211,153,.4); }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
  tbody tr:last-child td { border-bottom: none; }
  .scroll { overflow-x: auto; }

  .spark { display: flex; align-items: flex-end; gap: 2px; height: 46px; margin-top: 10px; }
  .spark i { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .85; }
  .spark.g2 i { background: var(--groq2); }
  .spark.mistral i { background: var(--mistral); }
  .empty { color: var(--muted); font-size: 12.5px; padding: 8px 0; }
  .totals { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 14px; }
  .tot { }
  .tot b { display: block; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tot span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .foot { margin-top: 26px; font-size: 11.5px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Provider Usage</h1>
      <div class="sub" id="sub">Loading…</div>
    </div>
    <button class="refresh" id="btn-refresh">Refresh</button>
  </header>

  <div class="banner" id="banner"></div>

  <div class="grid grid-4" id="windows"></div>

  <div class="card" style="margin-top:14px">
    <h2>Per API key</h2>
    <div class="totals" id="totals"></div>
    <div class="scroll">
      <table id="keys-table">
        <thead>
          <tr>
            <th>Key slot</th><th>Provider</th><th>Req/min</th><th>Req/hour</th>
            <th>Req/day</th><th>Req/week</th><th>Tok/min</th><th>Tok/hour</th>
            <th>Tok/day</th><th>Tok/week</th><th>429s</th>
          </tr>
        </thead>
        <tbody id="keys-body"><tr><td colspan="11" class="empty">No data yet.</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="grid grid-4" id="series" style="margin-top:14px"></div>

  <div class="foot" id="foot"></div>
</div>

<script>
(function () {
  'use strict';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpczMiOiJzdXBhYmFzZSIsInJlZiI6InprdXl0dmplcWtwZXhjYnlveWh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjUwNDAsImV4cCI6MjEwMzAwMTA0MH0.8tMbR057BmGaO0_T4nMOVLt1AAmWsPKBEopoSYYis44';
  var URL_BASE = 'https://zkuytvjeqkpexcbyoyhz.supabase.co/functions/v1/ai-stats';
  var WINDOWS = [
    { key: 'minute', label: 'Last minute' },
    { key: 'hour', label: 'Last hour' },
    { key: 'day', label: 'Today (24h)' },
    { key: 'week', label: 'Last 7 days' }
  ];

  function authHeader() {
    try {
      var raw = localStorage.getItem('sb-zkuytvjeqkpexcbyoyhz-auth-token');
      if (raw) {
        var t = JSON.parse(raw);
        if (t && t.access_token) return 'Bearer ' + t.access_token;
      }
    } catch (_) {}
    return 'Bearer ' + ANON;
  }

  function n(v) { return Number(v || 0).toLocaleString(); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function slotColor(slot) {
    if (/MISTRAL/i.test(slot)) return 'var(--mistral)';
    if (/_2$/.test(slot)) return 'var(--groq2)';
    if (/^GROQ/i.test(slot)) return 'var(--groq1)';
    return 'var(--muted)';
  }
  function sparkClass(slot) {
    if (/MISTRAL/i.test(slot)) return 'spark mistral';
    if (/_2$/.test(slot)) return 'spark g2';
    return 'spark';
  }

  function banner(msg, kind) {
    var el = document.getElementById('banner');
    if (!msg) { el.className = 'banner'; el.innerHTML = ''; return; }
    el.className = 'banner show ' + (kind || 'err');
    el.innerHTML = msg;
  }

  function renderWindows(data) {
    var html = '';
    WINDOWS.forEach(function (w) {
      var d = (data.windows && data.windows[w.key]) || {};
      html += '<div class="card">'
        + '<h2>' + w.label + '</h2>'
        + '<div class="metric"><div class="metric-top">'
        + '<span class="metric-label">Requests</span>'
        + '<span class="metric-val">' + n(d.requests) + '</span></div>'
        + '<div class="metric-sub">' + n(d.promptTokens) + ' in &middot; ' + n(d.completionTokens) + ' out</div></div>'
        + '<div class="metric"><div class="metric-top">'
        + '<span class="metric-label">Total tokens</span>'
        + '<span class="metric-val">' + n(d.totalTokens) + '</span></div>'
        + '<div class="metric-sub">' + n(d.rateLimited) + ' rate limited &middot; ' + n(d.failures) + ' failed</div></div>'
        + '</div>';
    });
    document.getElementById('windows').innerHTML = html;
  }

  function renderKeys(data) {
    var body = document.getElementById('keys-body');
    var totals = document.getElementById('totals');
    var byKey = data.byKey || {};
    var week = byKey.week || [];
    var hour = byKey.hour || {};
    var day = byKey.day || {};
    var minute = byKey.minute || {};

    // Union of every slot seen in any window, plus configured slots that are idle.
    var order = [];
    function add(slot) { if (order.indexOf(slot) === -1) order.push(slot); }
    (data.config && data.config.groqKeySlots || []).forEach(function (s) { if (s === 'GROQ_API_KEY' || s === 'GROQ_API_KEY_2') add(s); });
    ['minute', 'hour', 'day', 'week'].forEach(function (w) { (byKey[w] || []).forEach(function (r) { add(r.keySlot); }); });
    add('MISTRAL_API_KEY');

    function find(list, slot) {
      for (var i = 0; i < list.length; i++) if (list[i].keySlot === slot) return list[i];
      return null;
    }

    var rows = '';
    var totReq = 0, totTok = 0;
    order.forEach(function (slot) {
      var w = find(week, slot), h = find(hour, slot), d = find(day, slot), mi = find(minute, slot);
      var active = !!(w && w.requests) || !!(h && h.requests);
      totReq += (d ? d.requests : 0);
      totTok += (d ? d.totalTokens : 0);
      rows += '<tr>'
        + '<td><span class="keyhead"><span class="dot" style="background:' + slotColor(slot) + '"></span>' + esc(slot) + '</span></td>'
        + '<td>' + esc((w && w.provider) || (/MISTRAL/i.test(slot) ? 'mistral' : 'groq')) + '</td>'
        + '<td>' + n(mi && mi.requests) + '</td>'
        + '<td>' + n(h && h.requests) + '</td>'
        + '<td>' + n(d && d.requests) + '</td>'
        + '<td>' + n(w && w.requests) + '</td>'
        + '<td>' + n(mi && mi.totalTokens) + '</td>'
        + '<td>' + n(h && h.totalTokens) + '</td>'
        + '<td>' + n(d && d.totalTokens) + '</td>'
        + '<td>' + n(w && w.totalTokens) + '</td>'
        + '<td>' + n((w ? w.rateLimited : 0) + (d ? d.rateLimited : 0)) + '</td>'
        + '</tr>';
    });
    body.innerHTML = rows || '<tr><td colspan="11" class="empty">No data yet.</td></tr>';
    totals.innerHTML =
      '<div class="tot"><b>' + n(totReq) + '</b><span>requests / day</span></div>' +
      '<div class="tot"><b>' + n(totTok) + '</b><span>tokens / day</span></div>' +
      '<div class="tot"><b>' + n((data.config && data.config.groqKeysConfigured) || 0) + '</b><span>groq keys</span></div>' +
      '<div class="tot"><b>' + ((data.config && data.config.visionConfigured) ? 'on' : 'off') + '</b><span>vision</span></div>';
  }

  function renderSeries(data) {
    var el = document.getElementById('series');
    var s = data.series || [];
    if (!s.length) { el.innerHTML = ''; return; }
    el.innerHTML = s.map(function (s) {
      var pts = s.points || [];
      var max = 0;
      pts.forEach(function (p) { if (p.total > max) max = p.total; });
      var bars = '';
      if (max > 0) {
        // Last 60 minutes, one bar each.
        var start = Date.now() - 60 * 60 * 1000;
        var byMin = {};
        pts.forEach(function (p) { byMin[p.t] = p.total; });
        for (var i = 59; i >= 0; i--) {
          var t = new Date(start + i * 60 * 1000).toISOString().slice(0, 16) + ':00Z';
          var v = byMin[t] || 0;
          var h = max > 0 ? Math.max(2, Math.round((v / max) * 46)) : 2;
          bars += '<i style="height:' + h + 'px" title="' + t.slice(11, 16) + ' UTC — ' + n(v) + ' tokens"></i>';
        }
      }
      return '<div class="card"><h2>' + esc(s.keySlot) + ' &middot; last 60 min</h2>'
        + '<div class="metric-val">' + n(pts.reduce(function (a, p) { return a + p.total; }, 0)) + '</div>'
        + '<div class="metric-sub">tokens in the last hour</div>'
        + '<div class="' + sparkClass(s.keySlot) + '">' + (bars || '<span class="empty">No activity</span>') + '</div>'
        + '</div>';
    }).join('');
  }

  async function load() {
    var btn = document.getElementById('btn-refresh');
    btn.disabled = true;
    banner('');
    document.getElementById('sub').textContent = 'Loading…';
    try {
      var res = await fetch(URL_BASE, { headers: { 'Content-Type': 'application/json', 'Authorization': authHeader() } });
      var data = await res.json().catch(function () { return {}; });
      if (res.status === 401) { banner('Sign in to view usage stats.', 'err'); return; }
      if (res.status === 403) {
        banner('Your account is not authorised for usage stats. Add your email to the <code>AI_STATS_ADMIN_EMAILS</code> secret.', 'err');
        return;
      }
      if (data && data.needsMigration) {
        banner('Setup needed: run <code>supabase/migrations/20260928000000_ai_provider_usage.sql</code> in the Supabase SQL editor, then refresh. ' + esc(data.message || ''), 'warn');
        return;
      }
      if (!res.ok || !data.ok) { banner('Could not load stats: ' + esc(data.error || res.status), 'err'); return; }

      renderWindows(data);
      renderKeys(data);
      renderSeries(data);

      var gaps = [];
      if (data.coverage && data.coverage.doesNotCover) {
        gaps.push('Not counted: <code>' + (data.coverage.doesNotCover || []).join(', ') + '</code> (source not in this repo).');
      }
      if (data.config && data.config.groqKeysConfigured < 2) {
        gaps.push('Only one Groq key is set, so no failover is active. Add <code>GROQ_API_KEY_2</code> to secrets.');
      }
      document.getElementById('foot').innerHTML =
        (gaps.length ? '<div style="color:#FCD34D;margin-bottom:8px">' + gaps.join('<br>') + '</div>' : '')
        + 'Source: <code>ai_provider_usage</code>, written by the edge functions as calls complete. '
        + 'Groq exposes no usage API on this plan, so these are self-recorded totals for instrumented functions only.<br>'
        + 'Last updated ' + new Date(data.generatedAt).toLocaleString()
        + (data.config && data.config.droppedWrites ? ' &middot; ' + n(data.config.droppedWrites) + ' writes dropped' : '');

      document.getElementById('sub').textContent = 'Groq keys: ' + (data.config ? data.config.groqKeysConfigured : 0)
        + ' &middot; vision: ' + (data.config && data.config.visionConfigured ? 'configured' : 'not configured');
    } catch (e) {
      banner('Network error: ' + esc(e && e.message), 'err');
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById('btn-refresh').addEventListener('click', load);
  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
