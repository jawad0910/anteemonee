<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Message Stats — Anteemonee Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/anteemonee.png">
<style>
  :root {
    --bg: #0B0C0F; --card: #14161B; --card-2: #1A1D24; --border: #262A33;
    --text: #F2F4F8; --muted: #8A93A3; --accent: #6366F1; --warn: #F59E0B; --err: #F87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased; padding: 28px 20px 60px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .refresh {
    padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card-2); color: var(--text); font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all .15s ease;
  }
  .refresh:hover { border-color: #3A3F4B; }
  .refresh:disabled { opacity: .5; cursor: wait; }

  .banner { display: none; padding: 12px 15px; border-radius: 12px; font-size: 13px; line-height: 1.55; margin-bottom: 18px; border: 1px solid; }
  .banner.show { display: block; }
  .banner.err { background: rgba(248,113,113,.08); border-color: rgba(248,113,113,.35); color: #FCA5A5; }
  .banner.warn { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.32); color: #FCD34D; }
  .banner code { background: rgba(255,255,255,.07); padding: 1px 6px; border-radius: 5px; font-size: 12px; }

  .grid { display: grid; gap: 14px; }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 900px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .grid-4 { grid-template-columns: 1fr; } }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; }
  .card h2 { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
  .big { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .metric-sub { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 6px; }
  .spark { display: flex; align-items: flex-end; gap: 4px; height: 60px; margin-top: 14px; }
  .spark i { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }

  .tag { font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 2px 7px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--border); color: var(--muted); }
  .empty { color: var(--muted); font-size: 12.5px; padding: 10px 0; }
  .foot { margin-top: 26px; font-size: 11.5px; color: var(--muted); line-height: 1.65; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Message Stats</h1>
      <div class="sub" id="sub">Loading…</div>
    </div>
    <button class="refresh" id="btn-refresh">Refresh</button>
  </header>

  <div class="banner" id="banner"></div>

  <div class="grid grid-4" id="windows"></div>

  <div class="card" style="margin-top:14px">
    <h2>Messages per day &mdash; last 7 days</h2>
    <div class="spark" id="spark"></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
(function () {
  'use strict';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InprdXl0dmplcWtwZXhjYnlveWh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjUwNDAsImV4cCI6MjEwMzAwMTA0MH0.8tMbR057BmGaO0_T4nMOVLt1AAmWsPKBEopoSYYis44';
  var URL_BASE = 'https://zkuytvjeqkpexcbyoyhz.supabase.co/functions/v1/ai-stats';

  function authHeader() {
    try {
      var raw = localStorage.getItem('sb-zkuytvjeqkpexcbyoyhz-auth-token');
      if (raw) { var t = JSON.parse(raw); if (t && t.access_token) return 'Bearer ' + t.access_token; }
    } catch (_) {}
    return 'Bearer ' + ANON;
  }
  function n(v) { return Number(v || 0).toLocaleString(); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function banner(msg, kind) {
    var el = document.getElementById('banner');
    if (!msg) { el.className = 'banner'; el.innerHTML = ''; return; }
    el.className = 'banner show ' + (kind || 'err');
    el.innerHTML = msg;
  }

  function renderWindows(d) {
    var w = d.windows || {};
    document.getElementById('windows').innerHTML = ['minute', 'hour', 'day', 'week'].map(function (k) {
      var v = w[k] || { label: k, messages: 0, conversations: 0, students: 0 };
      return '<div class="card"><h2>' + esc(v.label) + '</h2>'
        + '<div class="big">' + n(v.messages) + '</div>'
        + '<div class="metric-sub">messages</div>'
        + '<div class="metric-sub">' + n(v.conversations) + ' chats &middot; ' + n(v.students) + ' students</div>'
        + '</div>';
    }).join('');
  }

  function renderSpark(byDay) {
    var el = document.getElementById('spark');
    if (!byDay || !byDay.length) { el.innerHTML = '<span class="empty">No activity.</span>'; return; }
    var max = Math.max.apply(null, byDay.map(function (d) { return d.messages; }).concat([1]));
    el.innerHTML = byDay.map(function (d) {
      var h = Math.max(2, Math.round((d.messages / max) * 60));
      return '<i style="height:' + h + 'px" title="' + d.day + ' — ' + n(d.messages) + ' messages"></i>';
    }).join('');
  }

  async function load() {
    var btn = document.getElementById('btn-refresh');
    btn.disabled = true;
    banner('');
    document.getElementById('sub').textContent = 'Loading…';
    try {
      var res = await fetch(URL_BASE, { headers: { 'Content-Type': 'application/json', 'Authorization': authHeader() } });
      var data = await res.json().catch(function () { return {}; });
      if (res.status === 401) { banner('Sign in to view stats.', 'err'); return; }
      if (res.status === 403) {
        banner('Your account is not authorised. Add your email to the <code>AI_STATS_ADMIN_EMAILS</code> secret in Supabase.', 'err');
        return;
      }
      if (!res.ok || !data.ok) { banner('Could not load stats: ' + esc(data.error || res.status), 'err'); return; }

      renderWindows(data);
      renderSpark(data.byDay);

      var w = data.windows || {};
      document.getElementById('sub').textContent =
        n((w.week || {}).messages) + ' messages from ' + n((w.week || {}).students) + ' students in the last 7 days';

      document.getElementById('foot').innerHTML =
        (data.capped ? '<div style="color:#FCD34D;margin-bottom:6px">Hit the ' + n(data.rowCap) +
          ' conversation read cap, so these totals are a lower bound.</div>' : '')
        + 'Last updated ' + new Date(data.generatedAt).toLocaleString();
    } catch (e) {
      banner('Network error: ' + esc(e && e.message), 'err');
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById('btn-refresh').addEventListener('click', load);
  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
