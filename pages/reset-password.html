<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Anteemonee</title>
  <meta name="description" content="Set a new password for your Anteemonee account.">
  <meta name="theme-color" content="#07080C">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/anteemonee.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="preconnect" href="https://zkuytvjeqkpexcbyoyhz.supabase.co">
  <link rel="stylesheet" href="../css/style.css?v=16">
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0" as="script">
</head>
<body>

  <header class="header header-auth">
    <div class="header-inner">
      <a href="../index.html" class="logo-link">
        <img src="../assets/anteemonee.png" alt="Anteemonee" class="logo-img">
        <span class="logo-text">Anteemonee</span>
      </a>
    </div>
  </header>

  <div class="auth-page">
    <div class="hero-glow hero-glow-1"></div>
    <div class="hero-glow hero-glow-2"></div>

    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="logo-link">
          <img src="../assets/anteemonee.png" alt="Anteemonee" class="logo-img">
          <span class="logo-text">Anteemonee</span>
        </a>
        <h1>Set New Password</h1>
        <p>Choose a strong password for your account</p>
      </div>

      <form class="auth-form" id="reset-password-form">
        <div class="auth-error" id="reset-error"></div>
        <div class="auth-success" id="reset-success"></div>

        <div class="form-group">
          <label for="reset-password">New Password</label>
          <input type="password" id="reset-password" class="form-input" placeholder="Enter new password" required minlength="8" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="reset-password-confirm">Confirm Password</label>
          <input type="password" id="reset-password-confirm" class="form-input" placeholder="Confirm new password" required minlength="8" autocomplete="new-password">
        </div>

        <button type="submit" class="btn-primary">Update Password</button>
      </form>

      <div class="auth-footer">
        <a href="login.html">Back to Sign In</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script>
  <script src="../js/account-manager.js?v=9"></script>
  <script src="../js/app.js?v=10"></script>
</body>
</html>
