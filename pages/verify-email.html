<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email - Wassal</title>
  <meta name="theme-color" content="#07080C">
  <link rel="icon" href="../assets/wassal.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="preconnect" href="https://zkuytvjeqkpexcbyoyhz.supabase.co">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0" as="script">
</head>
<body>

  <header class="header header-auth">
    <div class="header-inner">
      <a href="../index.html" class="logo-link">
        <img src="../assets/wassal.png" alt="Wassal" class="logo-img">
        <span class="logo-text">Wassal</span>
      </a>
    </div>
  </header>

  <div class="auth-page">
    <div class="hero-glow hero-glow-1"></div>
    <div class="hero-glow hero-glow-2"></div>

    <div class="auth-card" style="text-align:center">
      <div class="auth-header">
        <a href="../index.html" class="logo-link">
          <img src="../assets/wassal.png" alt="Wassal" class="logo-img">
          <span class="logo-text">Wassal</span>
        </a>
        <div style="width:72px;height:72px;border-radius:50%;background:var(--accent-soft);border:1.5px solid var(--accent-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:32px">&#9993;</div>
        <h1>Check Your Email</h1>
        <p>We've sent a verification link to your email address. Click the link to verify your account.</p>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px;margin-top:24px">
        <button class="btn-primary" id="resend-verification-btn" style="width:100%">Resend verification email</button>
        <a href="login.html" class="btn-secondary" style="width:100%;text-decoration:none">Back to Sign In</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script>
  <script src="../js/app.js"></script>
</body>
</html>
