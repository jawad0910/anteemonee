<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Anteemonee</title>
  <meta name="theme-color" content="#07080C">
  <link rel="icon" href="../assets/anteemonee.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="preconnect" href="https://zkuytvjeqkpexcbyoyhz.supabase.co">
  <link rel="stylesheet" href="../css/style.css?v=9">
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0" as="script">
</head>
<body>

  <header class="header header-auth">
    <div class="header-inner">
      <a href="../index.html" class="logo-link">
        <img src="../assets/anteemonee.png" alt="Anteemonee" class="logo-img">
        <span class="logo-text">Anteemonee</span>
      </a>
    </div>
  </header>

  <div class="auth-page">
    <div class="hero-glow hero-glow-1"></div>
    <div class="hero-glow hero-glow-2"></div>

    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="logo-link">
          <img src="../assets/anteemonee.png" alt="Anteemonee" class="logo-img">
          <span class="logo-text">Anteemonee</span>
        </a>
        <h1>Reset Password</h1>
        <p>Enter your email and we'll send you a reset link</p>
      </div>

      <form class="auth-form" id="forgot-password-form">
        <div class="auth-error" id="forgot-error"></div>
        <div class="auth-success" id="forgot-success"></div>

        <div class="form-group">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" class="form-input" placeholder="you@example.com" required autocomplete="email">
        </div>

        <button type="submit" class="btn-primary">Send Reset Link</button>
      </form>

      <div class="auth-footer">
        Remember your password? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script>
  <script src="../js/account-manager.js?v=9"></script>
  <script src="../js/app.js?v=9"></script>
</body>
</html>
